name: EvoXis'26 Automated Test & Quality Gate

on:
  push:
    branches: [main, kiran]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit, Validation, API & Concurrency Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run Test Suite (Vitest)
        run: npm test

      - name: Verify Production Build
        run: npm run build
